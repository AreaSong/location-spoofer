name: PaopaoLocationSpoofer
options:
  bundleIdPrefix: com.paopaolabs
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.7"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"

targets:
  PaopaoLocationSpoofer:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paopaolabs.location-spoofer
        PRODUCT_NAME: PaopaoLocationSpoofer
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/PaopaoLocationSpoofer.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Core $(PROJECT_DIR)/Vendor/idevice"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        SWIFT_OBJC_BRIDGING_HEADER: App/PaopaoLocationSpoofer-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -lwloccore"
        "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) -lidevice_ffi -lc++ -lz"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/Core/build/$(PLATFORM_NAME) $(PROJECT_DIR)/Vendor/idevice"
    dependencies:
      - target: RouteLiveActivity
        embed: true
    sources:
      - path: App
      - path: Shared
      - path: Resources
      - path: LiveActivity/RouteActivityAttributes.swift
      - path: ThirdParty/WlocScripts
        type: folder
        buildPhase: resources

  RouteLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget:
      iOS: "16.2"
    sources:
      - path: LiveActivity
        excludes:
          - Info.plist
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: 路线
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paopaolabs.location-spoofer.route-activity
        CODE_SIGN_ENTITLEMENTS: LiveActivity/RouteLiveActivity.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        SKIP_INSTALL: "YES"

  PaopaoLocationSpooferTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PaopaoLocationSpooferTests
    settings:
      base:
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Core"
        SWIFT_OBJC_BRIDGING_HEADER: App/PaopaoLocationSpoofer-Bridging-Header.h
    dependencies:
      - target: PaopaoLocationSpoofer

schemes:
  PaopaoLocationSpoofer:
    build:
      targets:
        PaopaoLocationSpoofer: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PaopaoLocationSpooferTests
    archive:
      config: Release
