#!name=Apple WLOC 定位修改
#!desc=修改 Apple 网络定位返回坐标
#!author=AreaSong
#!homepage=https://github.com/AreaSong/location-spoofer

[dns]
address = /location-spoofer.invalid/192.0.2.1

[filter_local]
host, location-spoofer.invalid, direct
ip-cidr, 127.0.0.0/8, direct

[rewrite_local]
^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|gsp-ssl\.ls\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc url script-response-body https://gh-proxy.org/https://raw.githubusercontent.com/AreaSong/location-spoofer/main/ThirdParty/WlocScripts/dist/v1/wloc.js
^(?:https:\/\/location-spoofer\.invalid|https?:\/\/gs-loc(?:-cn)?\.apple\.com)\/wloc-settings\/save(?:\?|$) url script-echo-response https://gh-proxy.org/https://raw.githubusercontent.com/AreaSong/location-spoofer/main/ThirdParty/WlocScripts/dist/v1/wloc-settings.js

[mitm]
hostname = location-spoofer.invalid, gs-loc.apple.com, gs-loc-cn.apple.com, gsp-ssl.ls.apple.com, bluedot.is.autonavi.com, bluedot.is.autonavi.com.gds.alibabadns.com
